name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@7d5ab6d7c9288e7513e2995dc432a86e73ded955  # v2.19.8
    permissions:
      contents: read
    with:
      golangci-lint-version: "v2.13.2"
      build-cmd-path: ./cmd/brutus
      build-binary-name: brutus
    secrets: inherit
