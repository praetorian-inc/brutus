name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@25c08fbd15a931e275f207ecee1758c931f89ea5  # v2.3.1
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/brutus
      build-binary-name: brutus
    secrets: inherit
