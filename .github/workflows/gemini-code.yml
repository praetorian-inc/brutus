name: Gemini PR Assistant

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: gemini-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # stray review comments must not cancel an in-progress review

jobs:
  gemini-review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'pull_request_review_comment' || contains(github.event.comment.body, '@gemini'))
    uses: praetorian-inc/public-workflows/.github/workflows/gemini-code.yml@8914810d961b02daa4c5353037dcedf14a4cc249  # v2.21.1
    permissions:
      contents: read
      pull-requests: write
      actions: read  # ENG-7654: fetch-graph downloads this repo's graphify artifact (fail-open skip if none)
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
