name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@9e7c9fe35c49ea3eadd256ba342c22a17a83ad55  # v2.2.1
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    secrets: inherit

