id: airflow
name: Apache Airflow
nerva: [airflow]
method: form
path: /login/
username_field: username
password_field: password
prefetch:
  path: /login/
  extract:
    csrf: 'name="csrf_token" value="([^"]+)"'
extra:
  csrf_token: "{{csrf}}"
success:
  status: [302, 303]
  header: Location
  header_has: /
  header_absent: /login
