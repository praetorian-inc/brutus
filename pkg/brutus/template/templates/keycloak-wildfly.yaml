id: keycloak-wildfly
name: Keycloak on WildFly
nerva: [keycloak, keycloak-wildfly]
method: form
path: /auth/realms/master/protocol/openid-connect/token
username_field: username
password_field: password
extra:
  grant_type: password
  client_id: admin-cli
success:
  status: [200]
  body: ["access_token"]
  body_absent: ["invalid_grant"]
