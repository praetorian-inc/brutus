id: opnsense
name: OPNsense
nerva: [opnsense]
method: form
path: /
username_field: usernamefld
password_field: passwordfld
prefetch:
  path: /
  extract:
    csrf: 'name="__csrf_magic" value="([^"]+)"'
extra:
  __csrf_magic: "{{csrf}}"
  login: Login
success:
  status: [302, 303]
  header: Location
  header_has: /ui
  header_absent: login
