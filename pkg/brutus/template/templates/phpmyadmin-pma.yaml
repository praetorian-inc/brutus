id: phpmyadmin-pma
name: phpMyAdmin at /pma
nerva: [phpmyadmin, phpmyadmin-pma]
method: form
path: /pma/index.php
username_field: pma_username
password_field: pma_password
prefetch:
  path: /pma/index.php
  extract:
    token: 'name="token" value="([^"]+)"'
extra:
  server: "1"
  token: "{{token}}"
success:
  status: [200, 302]
  body_absent: ["access denied", "cannot log in"]
creds:
  - "root:"
  - "root:root"
  - "admin:admin"
